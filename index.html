/* Layout: app de operación. Barra lateral oscura fija con las secciones; arriba una barra con fecha y búsqueda; contenido en tarjetas. El detalle del pedido abre en un panel lateral. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #f4f6f8;
  --ink: #141a21;
  --ink-2: #3a4652;
  --muted: #6b7783;
  --line: #e1e6eb;
  --side: #161b21;
  --side-ink: #c9d1d9;
  --side-muted: #7d8894;
  --side-hover: #222932;
  --accent: #d6452b;
  --accent-soft: #fbe6e1;
  --accent-ink: #ffffff;
  --frost: #2d78a8;  --frost-soft: #e1eef7;
  --ok: #23845a;     --ok-soft: #dff3e9;
  --warn: #b26a00;   --warn-soft: #fcefd9;
  --crit: #c93a22;   --crit-soft: #fbe3de;
  --wa-bg: #efe7de; --wa-in: #ffffff; --wa-out: #d9fdd3; --wa-top: #075e54;
  --s-margherita: #d6452b; --s-rucula: #8fb63c; --s-pepperoni: #a8281e; --s-funghi: #8a6748; --s-pesto: #2f6f5e; --s-verdura: #d9a521;
  --shadow: 0 1px 2px rgba(20,26,33,.06), 0 4px 16px rgba(20,26,33,.06);
  --shadow-lg: 0 24px 60px rgba(20,26,33,.22);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1116; --surface: #161c23; --sunk: #1c242c; --ink: #e8edf2; --ink-2: #c3ccd5; --muted: #8b97a3; --line: #26303a;
  --side: #0a0e12; --side-ink: #c9d1d9; --side-muted: #6f7a86; --side-hover: #161c23;
  --accent: #ec5d43; --accent-soft: #3a1b15; --accent-ink: #1a0905;
  --frost: #6fb3dd; --frost-soft: #13293a; --ok: #5cc794; --ok-soft: #12301f; --warn: #f0b04f; --warn-soft: #36270d; --crit: #f07a63; --crit-soft: #3a1914;
  --wa-bg: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --wa-top: #1f2c34;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --sunk: #1c242c; --ink: #e8edf2; --ink-2: #c3ccd5; --muted: #8b97a3; --line: #26303a;
  --side: #0a0e12; --side-ink: #c9d1d9; --side-muted: #6f7a86; --side-hover: #161c23;
  --accent: #ec5d43; --accent-soft: #3a1b15; --accent-ink: #1a0905;
  --frost: #6fb3dd; --frost-soft: #13293a; --ok: #5cc794; --ok-soft: #12301f; --warn: #f0b04f; --warn-soft: #36270d; --crit: #f07a63; --crit-soft: #3a1914;
  --wa-bg: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --wa-top: #1f2c34;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: 1.75rem; font-weight: 700; } h2 { font-size: 1.08rem; font-weight: 700; } h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
.num, .mono, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--frost); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
svg { display: block; }

/* --- Estructura --- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding-block: 22px 18px; padding-inline: 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 11px; align-items: center; padding: 0 6px; }
.brand b { font-family: var(--display); font-size: 1.12rem; font-weight: 800; color: #fff; display: block; line-height: 1.1; letter-spacing: -0.01em; }
.brand small { color: var(--side-muted); font-size: .76rem; }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sec { font: 500 .66rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--side-muted); padding: 14px 10px 6px; }
nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--side-ink); text-decoration: none; font-weight: 500; position: relative; }
nav a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
nav a:hover { background: var(--side-hover); }
nav a[aria-current="page"] { background: var(--side-hover); color: #fff; }
nav a[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
nav a[aria-current="page"] svg { opacity: 1; color: var(--accent); }
nav a .badge { margin-left: auto; background: var(--accent); color: #fff; font: 600 .7rem var(--mono); border-radius: 99px; padding: 1px 7px; }
nav a .fase { margin-left: auto; font: 500 .64rem var(--mono); color: var(--side-muted); }
.side-card { margin-top: auto; background: var(--side-hover); border-radius: 12px; padding: 12px 14px; font-size: .8rem; color: var(--side-muted); display: flex; flex-direction: column; gap: 4px; }
.side-card b { color: #f0b04f; font: 600 .7rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-block: 12px; padding-inline: 28px; display: flex; align-items: center; gap: 16px; }
.top .when { display: flex; flex-direction: column; line-height: 1.2; }
.top .when b { font-family: var(--display); font-size: 1rem; }
.top .when span { color: var(--muted); font-size: .8rem; }
.search { margin-left: auto; position: relative; width: min(320px, 40vw); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px 9px 34px; font: inherit; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 9px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 .78rem var(--body); color: #fff; flex: none; }
.who .avatar { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); }
.mark { width: 38px; height: 38px; border-radius: 11px; background: #fff; color: #111; display: grid; place-items: center; font: 800 1.02rem/1 Georgia, "Times New Roman", serif; letter-spacing: -0.06em; flex: none; position: relative; overflow: hidden; }
.mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #1f8f46 0 33%, #fff 33% 66%, #d12f3c 66%); }
.who small { display: block; color: var(--muted); font-size: .74rem; line-height: 1.1; }
.who b { font-size: .86rem; display: block; line-height: 1.2; }

main { padding-block: 24px 64px; padding-inline: 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.eyebrow { font: 500 .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.eyebrow.demo { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head p { color: var(--muted); font-size: .84rem; }
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }

/* --- Indicadores --- */
.kpi { display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 14px; }
.kpi .top-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .84rem; font-weight: 500; }
.kpi .ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
.kpi .ico svg { width: 17px; height: 17px; }
.kpi .v { font: 700 2rem/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .foot { display: flex; justify-content: space-between; align-items: end; gap: 8px; font-size: .78rem; color: var(--muted); }
.delta { font: 600 .74rem var(--mono); padding: 2px 7px; border-radius: 99px; }
.delta.up { color: var(--ok); background: var(--ok-soft); } .delta.down { color: var(--crit); background: var(--crit-soft); }
.tone-crit .ico { background: var(--crit-soft); color: var(--crit); }
.tone-frost .ico { background: var(--frost-soft); color: var(--frost); }
.tone-warn .ico { background: var(--warn-soft); color: var(--warn); }
.tone-ok .ico { background: var(--ok-soft); color: var(--ok); }

/* --- Alertas --- */
.todo { display: flex; flex-direction: column; }
.todo-item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; }
.todo-item .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
.todo-item .ico svg { width: 18px; height: 18px; }
.todo-item b { display: block; font-weight: 600; }
.todo-item small { color: var(--muted); font-size: .82rem; }
.go { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-weight: 600; font-size: .82rem; white-space: nowrap; }
.go:hover { border-color: var(--ink); }

/* --- Chips y botones --- */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 .72rem var(--body); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); } .chip.info { background: var(--frost-soft); color: var(--frost); }
.chip.mute { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.chip svg { width: 12px; height: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn svg { width: 16px; height: 16px; }

/* --- Pizza (ilustración por sabor) --- */
.pz { --c: var(--accent); width: var(--sz, 34px); height: var(--sz, 34px); border-radius: 50%; flex: none; position: relative;
  background:
    radial-gradient(circle at 32% 36%, var(--c) 0 9%, transparent 10%),
    radial-gradient(circle at 64% 30%, var(--c) 0 8%, transparent 9%),
    radial-gradient(circle at 58% 64%, var(--c) 0 10%, transparent 11%),
    radial-gradient(circle at 30% 66%, var(--c) 0 7%, transparent 8%),
    radial-gradient(circle at 50% 50%, #f7e7c4 0 54%, #e9c27f 55% 68%, #c98a3f 69% 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.flav { display: flex; align-items: center; gap: 10px; min-width: 0; }
.flav b { font-weight: 600; }
.stack { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--sunk); gap: 2px; }
.stack i { display: block; height: 100%; }

/* --- Tablas --- */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th { text-align: left; font: 500 .68rem var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.meter { height: 8px; background: var(--sunk); border-radius: 99px; position: relative; min-width: 80px; overflow: visible; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--frost); }
.meter.low i { background: var(--crit); } .meter.mid i { background: var(--warn); }

/* --- Pedidos (tablero) --- */
.board-wrap { overflow-x: auto; padding-bottom: 8px; margin-inline: -4px; padding-inline: 4px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(212px, 1fr)); gap: 14px; min-width: 1320px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 600; font-size: .9rem; }
.col-h .dot { width: 9px; height: 9px; border-radius: 50%; }
.col-h .n { margin-left: auto; font: 500 .74rem var(--mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
.col-body { background: color-mix(in srgb, var(--surface) 45%, var(--bg)); border: 1px dashed var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 280px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 10px; width: 100%; box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .12s ease; }
.ocard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.ocard.big { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.ocard .r1 { display: flex; align-items: center; gap: 9px; }
.ocard .r1 .avatar { width: 30px; height: 30px; font-size: .7rem; border-radius: 9px; }
.ocard .r1 b { display: block; font-size: .9rem; line-height: 1.25; }
.ocard .r1 small { color: var(--muted); font: .72rem var(--mono); }
.ocard .r3 { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); gap: 6px; flex-wrap: wrap; }
.ocard .r3 strong { color: var(--ink); font: 600 .84rem var(--mono); }
.ocard.flash { animation: flash 1.4s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--ok-soft), var(--shadow); } 100% { box-shadow: var(--shadow); } }

/* --- Panel lateral del pedido --- */
.scrim { position: fixed; inset: 0; background: rgba(10,14,18,.42); z-index: 40; animation: fade .2s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 41; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slide .26s cubic-bezier(.2,.8,.2,1); }
.drawer-h { padding: 20px 24px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: start; }
.drawer-h .x { margin-left: auto; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.drawer-b { overflow-y: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
.drawer-f { padding: 14px 24px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.drawer-f .sum { margin-right: auto; }
.drawer-f .sum b { font: 700 1.25rem var(--display); display: block; }
.drawer-f .sum small { color: var(--muted); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
.split { display: flex; gap: 4px; margin-top: 4px; height: 10px; border-radius: 99px; overflow: hidden; }
.split i { display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 30px; bottom: 2px; width: 2px; background: var(--line); }
.timeline .tdot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); border: 1px solid var(--line); font: 600 .74rem var(--mono); }
.timeline .tdot.hot { background: var(--accent); border-color: var(--accent); color: #fff; }
.timeline .tdot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.timeline b { display: block; }
.timeline small { color: var(--muted); }

/* --- WhatsApp --- */
.wa-wrap { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
.phone { background: #0b0f13; border-radius: 46px; padding: 11px; box-shadow: var(--shadow-lg), inset 0 0 0 2px #2a313a; width: 100%; max-width: 380px; }
.screen { border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; height: 680px; background: var(--wa-bg); position: relative; }
.status { background: var(--wa-top); color: #fff; display: flex; justify-content: space-between; padding: 10px 24px 4px; font: 600 .74rem var(--body); }
.wa-head { background: var(--wa-top); color: #fff; padding: 6px 14px 12px; display: flex; gap: 10px; align-items: center; }
.wa-head .pz { --sz: 38px; --c: var(--s-margherita); }
.wa-head b { display: block; font-size: .95rem; }
.wa-head small { opacity: .8; font-size: .74rem; }
.wa-head .back { width: 18px; height: 18px; opacity: .9; }
.msgs { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1.2px); background-size: 18px 18px; }
.day { align-self: center; background: var(--wa-in); color: var(--muted); font: 600 .7rem var(--body); padding: 4px 10px; border-radius: 8px; margin: 4px 0; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.msg { max-width: 82%; padding: 7px 9px 4px 10px; border-radius: 10px; font-size: .87rem; line-height: 1.38; box-shadow: 0 1px 0 rgba(0,0,0,.1); white-space: pre-line; color: var(--ink); animation: pop .22s ease; }
.msg.in { background: var(--wa-in); align-self: flex-start; border-top-left-radius: 3px; }
.msg.out { background: var(--wa-out); align-self: flex-end; border-top-right-radius: 3px; }

const total = (p) => Object.entries(p.items).reduce((a, [s, q]) => a + q * SABORES[s].precio, 0);
const pz = (s, sz = 34) => `<span class="pz" style="--sz:${sz}px;--c:var(--s-${s})" aria-hidden="true"></span>`;
const ini = (t) => t.replace(/^(Bar|Café|Supermercado|Almacén|Rotisería|Kiosco|Cervecería|Autoservicio)\s+/i, "").split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const tono = (t) => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 42%)`; };
function reservadoPor(excluirId) {
  const r = {}; Object.keys(SABORES).forEach(s => r[s] = 0);
  PEDIDOS.filter(p => RESERVAN.includes(p.estado) && p.id !== excluirId).sort((a, b) => a.id - b.id).forEach(p => {
    for (const [s, q] of Object.entries(p.items)) r[s] += Math.min(q, Math.max(0, SABORES[s].freezer - r[s]));
  });
  return r;
}
function plan(p) {
  const res = reservadoPor(p.id);
  const filas = Object.entries(p.items).map(([s, q]) => { const disp = Math.max(0, SABORES[s].freezer - res[s]); const delFreezer = Math.min(q, disp); return { s, q, disp, delFreezer, armar: q - delFreezer }; });
  const aArmar = filas.reduce((a, f) => a + f.armar, 0);
  const necesita = {}; Object.keys(INSUMOS).forEach(k => necesita[k] = 0);
  filas.forEach(f => { necesita.bases += f.armar; necesita.envases += f.armar; necesita.etiquetas += f.armar; for (const [ing, g] of Object.entries(SABORES[f.s].receta)) necesita[ing] += f.armar * g / 1000; });
  const compras = Object.entries(necesita).filter(([, v]) => v > 0).map(([k, v]) => ({ k, v, stock: INSUMOS[k].stock, falta: Math.max(0, v - INSUMOS[k].stock) }));
  return { filas, aArmar, dias: Math.ceil(aArmar / CAPACIDAD_DIA), compras };
}
function alcanzaPara(k) {
  const ins = INSUMOS[k]; if (ins.porPizza) return Math.floor(ins.stock / ins.porPizza);
  const usos = Object.values(SABORES).map(s => s.receta[k]).filter(Boolean);
  const prom = usos.reduce((a, b) => a + b, 0) / usos.length; return Math.floor(ins.stock * 1000 / prom);
}
function spark(vals, color, w = 84, h = 26) {
  const max = Math.max(...vals, 1), min = Math.min(...vals), sx = (i) => 2 + i * (w - 4) / (vals.length - 1), sy = (v) => h - 3 - (v - min) / (max - min || 1) * (h - 6);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}L${sx(vals.length - 1)},${h}L2,${h}Z" fill="${color}" opacity=".12"></path><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="${sx(vals.length - 1)}" cy="${sy(vals[vals.length - 1])}" r="3" fill="${color}"></circle></svg>`;
}

  const b = { aldia: COBROS.filter(c => !c.atraso), poco: COBROS.filter(c => c.atraso > 0 && c.atraso < 10), mucho: COBROS.filter(c => c.atraso >= 10) };

  const est = (c) => c.atraso >= 10 ? '<span class="chip crit">Llamar</span>' : c.atraso > 0 ? '<span class="chip warn">Vencida</span>' : '<span class="chip ok">Al día</span>';
  view.innerHTML = head("Fase 4 · cobranza de cuentas corrientes", "Cobranza", "Avisos a los 1, 5 y 10 días. Al día 10 el aviso te llega a vos, no al cliente. Todo queda como borrador hasta que lo apruebes.") + `
  <section class="card"><div class="card-head"><div><h2>${$(tot)} a cobrar</h2><p>${COBROS.length} clientes con saldo</p></div></div>
    <div class="aging"><i style="flex:${s(b.aldia)};background:var(--ok)"></i><i style="flex:${s(b.poco)};background:var(--warn)"></i><i style="flex:${s(b.mucho)};background:var(--crit)"></i></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Al día ${$(s(b.aldia))}</span><span><i style="background:var(--warn)"></i>1 a 9 días ${$(s(b.poco))}</span><span><i style="background:var(--crit)"></i>10 días o más ${$(s(b.mucho))}</span></div></section>
  <div class="grid g-main">
    <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th class="n">Saldo</th><th>Vence</th><th class="n">Atraso</th><th>Estado</th><th></th></tr></thead><tbody>
      ${COBROS.map((c, i) => `<tr><td><span class="flav"><span class="avatar" style="background:${tono(c.cli)};width:30px;height:30px;font-size:.68rem;border-radius:9px">${ini(c.cli)}</span><b>${c.cli}</b></span></td><td class="n">${$(c.monto)}</td><td class="num">${c.vence}</td><td class="n">${c.atraso ? c.atraso + " d" : "-"}</td><td>${est(c)}</td><td>${c.atraso ? `<button class="go" data-b="${i}">Ver aviso</button>` : ""}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card" id="borrador"><div class="card-head"><h2>Borrador del aviso</h2></div><p class="muted">Tocá "Ver aviso" en un cliente con atraso.</p></section>
  </div>`;
  view.querySelectorAll("[data-b]").forEach(btn => btn.onclick = () => {
    const c = COBROS[+btn.dataset.b], alDueno = c.atraso >= 10;
    const txt = alDueno ? `${c.cli} no pagó ${$(c.monto)} y ya van ${c.atraso} días. Recibió ${c.avisos} avisos. Te conviene llamarlo vos.` : `Hola, ¿cómo va? Te recuerdo el saldo de ${$(c.monto)} que venció el ${c.vence}. Si ya lo pagaste, avisame y lo marco. ¡Gracias!`;
    document.getElementById("borrador").innerHTML = `<div class="card-head"><h2>${alDueno ? "Aviso para vos" : `Aviso para ${c.cli}`}</h2><span class="chip warn">Borrador</span></div>
      <div class="bubble ${alDueno ? "me" : ""}">${txt}</div><p class="muted" style="font-size:.8rem;margin-top:10px">${alDueno ? "Al día 10 el sistema no le escribe más al cliente: te avisa a vos." : "Sale por WhatsApp como plantilla aprobada por Meta, solo si lo aprobás."}</p>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" id="aprobar">${IC.send}${alDueno ? "Marcar como visto" : "Aprobar y enviar"}</button><button class="btn" id="descartar">Descartar</button></div>`;
    document.getElementById("aprobar").onclick = () => toast("En la demo no se manda nada. En el sistema real sale por WhatsApp.");
    document.getElementById("descartar").onclick = () => VISTAS.cobranza();
  });
};

      <p class="muted" style="font-size:.78rem;margin-top:8px">Borrador. Se manda solo si lo aprobás.</p></section>

// ===== Aplicar la configuración =====
(function aplicarConfig() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("cfg-marca", CONFIG.marca); set("cfg-sub", CONFIG.subtitulo); set("cfg-fecha", CONFIG.fecha);
  set("cfg-equipo", CONFIG.equipo); set("cfg-rol", CONFIG.rol); set("cfg-ini", CONFIG.iniciales);
  document.title = "Panel " + CONFIG.marca;
  if (CONFIG.logo) { const l = document.getElementById("cfg-logo"); l.className = "mark"; l.textContent = CONFIG.logo; }
  if (CONFIG.acento) { document.documentElement.style.setProperty("--accent", CONFIG.acento); }
  const pares = Object.entries(CONFIG.vocab).filter(([k, v]) => k !== v);
  if (!pares.length) return;
  pares.sort((a, b) => b[0].length - a[0].length);
  const re = new RegExp("\\b(" + pares.map(([k]) => k).join("|") + ")\\b", "gi");
  const mapa = Object.fromEntries(pares);
  const cambiar = (txt) => txt.replace(re, (m) => { const v = mapa[m.toLowerCase()]; return m[0] === m[0].toUpperCase() ? v[0].toUpperCase() + v.slice(1) : v; });
  const recorrer = (root) => { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) { const t = cambiar(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; } };
  const obs = new MutationObserver(() => { obs.disconnect(); recorrer(document.body); obs.observe(document.body, { childList: true, subtree: true }); });
  window.__vocab = () => recorrer(document.body);
  recorrer(document.body); obs.observe(document.body, { childList: true, subtree: true });
})();

ir((location.hash || "#hoy").slice(1));
